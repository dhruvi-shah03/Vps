name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qry VPS_Management.ipa Payload
          cd ../../..
          mkdir -p dist
          mv build/ios/iphoneos/VPS_Management.ipa dist/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPS_Management_iOS_IPA
          path: dist/VPS_Management.ipa
